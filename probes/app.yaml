apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: probes
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/samzhuo/argocd-test.git
    targetRevision: main
    path: probes/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true