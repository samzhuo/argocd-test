apiVersion: monitoring.coreos.com/v1
kind: Probe

metadata:
  name: grafana-probe
  namespace: monitoring

spec:
  interval: 30s

  module: http_2xx

  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115

  targets:
    staticConfig:
      static:
        - https://grafana.lab.local
