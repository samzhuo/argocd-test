---
# Source: nginx-helm/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-test-nginx-helm
  labels:
    helm.sh/chart: nginx-helm-0.1.0
    app.kubernetes.io/name: nginx-helm
    app.kubernetes.io/instance: nginx-test
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
# Source: nginx-helm/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-helm-pvc

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: local-path

  resources:
    requests:
      storage: 1Gi
---
# Source: nginx-helm/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx-test-nginx-helm
  labels:
    helm.sh/chart: nginx-helm-0.1.0
    app.kubernetes.io/name: nginx-helm
    app.kubernetes.io/instance: nginx-test
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: nginx-helm
    app.kubernetes.io/instance: nginx-test
---
# Source: nginx-helm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test-nginx-helm
  labels:
    helm.sh/chart: nginx-helm-0.1.0
    app.kubernetes.io/name: nginx-helm
    app.kubernetes.io/instance: nginx-test
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-helm
      app.kubernetes.io/instance: nginx-test
  template:
    metadata:
      labels:
        helm.sh/chart: nginx-helm-0.1.0
        app.kubernetes.io/name: nginx-helm
        app.kubernetes.io/instance: nginx-test
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: nginx-test-nginx-helm
      containers:
        - name: nginx-helm
          image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/nginx:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: nginx-storage
---
# Source: nginx-helm/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-test-nginx-helm
  labels:
    helm.sh/chart: nginx-helm-0.1.0
    app.kubernetes.io/name: nginx-helm
    app.kubernetes.io/instance: nginx-test
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: traefik
  rules:
    - host: "nginx.lab.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-test-nginx-helm
                port:
                  number: 80
